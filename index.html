<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>UI24R IEM Control</title>
<style>
html, body {
  margin: 0; padding: 0;
  height: 100%; width: 100%;
  font-family: Arial, sans-serif;
  overflow: hidden;
  background-color: #121212;
  color: #fff;
  user-select: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
}

#header, #footer {
  height: 40px; line-height:40px;
  background-color: #1f1f1f; color:#fff;
  position: fixed; width:100%; left:0; z-index:10;
}

#header {
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between; /* ← spinge i gruppi ai lati */
  position: fixed;
  width: 100%;
  padding: 0 5px;
  box-sizing: border-box;
}

#header-left, #header-right {
  display: flex;
  align-items: center;
}

#header-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  font-weight: bold;
}



.header-btn {
  background-color:#3a3a3a; color:#fff; border:1px solid #555;
  margin-right:5px; padding:0 8px; height:28px; font-size:14px;
  cursor:pointer;
}



.header-btn:active { background-color:#505050; }

#header-title {
  position:absolute; left:50%; transform:translateX(-50%);
  text-align:center; font-weight:bold;
}

#footer {
  bottom:0; display:flex; justify-content:space-between; align-items:center; padding:0;
}




#slider-label { width:20%; text-align:center; }
#slider-range { width:60%; }
#slider-value { width:20%; text-align:center; }

#grid-wrapper {
  position:absolute; top:40px; bottom:40px; left:0; right:0;
}

.cell {
  float:left; width:20%; height:25%;
  border:1px solid #0d8726; background-color:#1a1a1a;
  box-sizing:border-box; display:block; color:#fff;
}

.row-top {
  height:25%; width:100%;
  display:flex; justify-content:center; align-items:center;
  font-size:20px; box-sizing:border-box;
  background-color:#2c2c2c; padding:2px;
}

.row-bottom {
  height:75%; width:100%; display:block; text-align:center;
  background-color:#121212; color:#fff; box-sizing:border-box; padding:2px; overflow:hidden;
}

.slider-container {
  display:table; width:100%; height:100%;
  background-color:#1a1a1a; border-collapse:collapse; font-size:20px;
}

.slider-container div {
  display:table-cell; vertical-align:middle; text-align:center; padding:2px;
}

.slider-container div:first-child, .slider-container div:last-child { width:40%; }
.slider-container div:nth-child(2) { width:20%; }

.slider-container button {
  width:100%; height:100%; box-sizing:border-box;
  font-size:25px; background-color:#3a3a3a; color:#fff; border:1px solid #555; cursor:pointer;
}

.slider-container button:active { background-color:#505050; }

.slider-container span {
  width:100%; display:block;
  background-color:#121212; color:orange;
  font-size:30px; line-height:normal;
}

.value-sync { color:#00ff66; }
.value-pending { color:orange; }

.dialog {
  display:none; position:fixed; top:0; left:0; right:0; bottom:0;
  background-color:rgba(0,0,0,0.7); z-index:1000;
}

.dialog-content {
  width:80%; max-width:300px;
  margin:20px auto 0 auto; /* 20px distanza dall'alto, auto centrato orizzontalmente */
  background-color:#1a1a1a; color:#fff;
  padding:20px; border:1px solid #444; text-align:center;
}

.close-btn {
  margin-top:10px; padding:5px 10px;
  background-color:#2c2c2c; color:#fff; border:1px solid #444;
}


#config-dialog-content {
    width: 80%; 
    max-width: 250px;
    margin: 20px auto 0 auto; /* distanza dall'alto e centrato */
    background-color: #1a1a1a;
    color: #fff;
    padding: 15px 10px;
    border: 1px solid #444;
    text-align: left; /* testo e lista a sinistra */
    font-size: 14px;
}

#aux-list {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding-left: 0;
    margin-bottom: 10px;
}

#aux-list label {
    margin-bottom: 2px;
    cursor: pointer;
    display: flex;
    align-items: center;
}

#aux-list input[type="radio"] {
    margin-right: 5px;
}

#config-dialog-content p,
#config-dialog-content .header-btn {
    text-align: center; /* centra il testo del paragrafo */
    display: block;
    margin-left: auto;
    margin-right: auto; /* centra il pulsante */
}

#listen-list {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding-left: 0;
  margin: 10px 0;
}

#listen-list label {
  display: flex;
  align-items: center;
  cursor: pointer;
  color: #fff;
  margin-bottom: 5px;
  font-size: 14px;
}

#listen-list input[type="radio"] {
  margin-right: 8px;
  accent-color: orange; /* colore del pallino */
  cursor: pointer;
}
</style>
</head>
<body>

<div id="header">
  <div id="header-left">
    <button id="open-log-dialog" class="header-btn" onclick="openDialog('log-dialog')">⚡</button>
    <button id="open-config-dialog" class="header-btn" onclick="openDialog('config-dialog')">✏️</button>
  </div>
  
  <div id="header-title">UI24R IEM Control</div>
  
  <div id="header-right">
    <button id="listenButton" class="header-btn">🎧 Listen</button>
    <button id="fullscreen-btn" class="header-btn">⛶</button>
  </div>
</div>
  
</div>

<div id="grid-wrapper"></div>

<div id="footer">
  <label for="slider-range" id="slider-label">Master AUX</label>
  <input type="range" id="slider-range" min="0" max="10" step="0.5" value="0" />
  <span id="slider-value">0.0</span>
</div>

<!-- Config Dialog -->
<div id="config-dialog" class="dialog">
  <div id="config-dialog-content" class="dialog-content">
    <p>Seleziona AUX in EDIT:</p>
    <div id="aux-list"></div>
    <button id="config-dialog-close" class="header-btn" onclick="closeDialog('config-dialog')">
      Chiudi
    </button>
  </div>
</div>

<div id="log-dialog" class="dialog">
  <div id="log-dialog-content" class="dialog-content">
    <div style="display:flex; align-items:center; margin-bottom:5px;">
      <label for="mixer-ip" style="flex:1;">IP Mixer:</label>
      <input type="text" id="mixer-ip" style="flex:2; margin-right:5px;" />
      <button id="connect-btn" style="flex:1;" class="header-btn" onclick="connectToMixer()">Connetti</button>
    </div>
    <textarea id="log-area" readonly style="width:100%; height:150px; background:#1a1a1a; color:#fff; border:1px solid #555; resize:none; overflow-y:scroll;"></textarea>
    
    <button id="log-dialog-close" class="header-btn" onclick="closeDialog('log-dialog')">Chiudi</button>
  </div>
</div>

<div id="listen-dialog" class="dialog">
  <div class="dialog-content">
    <p>Seleziona sorgente:</p>
    <div id="listen-list"></div>
    <button id="listen-dialog-close" class="header-btn" onclick="closeDialog('listen-dialog')">Chiudi</button>
  </div>
</div>

<script>
// MODELLO
var auxCount = 10;
var chCount = 20;
var currentAux = { value: 1 };

var model = [], pending = [];
for(var a=0;a<auxCount;a++){
  model[a]=[]; pending[a]=[];
  for(var c=0;c<chCount;c++){
    model[a][c]=0.0;
    pending[a][c]=true;
  }
}

// CREA GRIGLIA
var wrapper = document.getElementById("grid-wrapper");
for(var i=1;i<=chCount;i++){
  var cell=document.createElement("div");
  cell.className="cell"; cell.id="cell_wrapper_"+i;

  var rowTop=document.createElement("div");
  rowTop.className="row-top"; rowTop.id="ch_name_"+i;
  rowTop.textContent="Top "+i;

  var rowBottom=document.createElement("div");
  rowBottom.className="row-bottom"; rowBottom.id="fader_"+i;

  var container=document.createElement("div");
  container.className="slider-container"; container.id="slider_container_"+i;

  var btnDecDiv=document.createElement("div");
  var decButton=document.createElement("button");
  decButton.textContent="-"; decButton.setAttribute("data-ch",i-1);
  btnDecDiv.appendChild(decButton);

  var valueDiv=document.createElement("div");
  var valueSpan=document.createElement("span");
  valueSpan.id="fader_value_"+i;
  valueSpan.textContent=(model[currentAux.value][i-1]*10).toFixed(1);
  valueSpan.className="value-pending";
  valueDiv.appendChild(valueSpan);

  var btnIncDiv=document.createElement("div");
  var incButton=document.createElement("button");
  incButton.textContent="+"; incButton.setAttribute("data-ch",i-1);
  btnIncDiv.appendChild(incButton);

  container.appendChild(btnDecDiv);
  container.appendChild(valueDiv);
  container.appendChild(btnIncDiv);
  rowBottom.appendChild(container);
  cell.appendChild(rowTop);
  cell.appendChild(rowBottom);
  wrapper.appendChild(cell);
}

// EVENT DELEGATION
wrapper.onclick=function(e){
  var target=e.target||e.srcElement;
  if(target.tagName==="BUTTON"){
    var ch=parseInt(target.getAttribute("data-ch"));
    var step=0.05;
    var valueSpan=document.getElementById("fader_value_"+(ch+1));
    if(target.textContent==="-" ){
      model[currentAux.value][ch]-=step;
      if(model[currentAux.value][ch]<0) model[currentAux.value][ch]=0;
    }else if(target.textContent==="+"){
      model[currentAux.value][ch]+=step;
      if(model[currentAux.value][ch]>1) model[currentAux.value][ch]=1;
    }
    pending[currentAux.value][ch]=true;
    valueSpan.textContent = (model[currentAux.value][ch] * 10).toFixed(1); // 0.00 - 10.00
    valueSpan.className="value-pending";
    updateFromUI(currentAux.value,ch,model[currentAux.value][ch]);
  }
};

// FUNZIONI
function updateFromUI(aux,ch,val){
  console.log("updateFromUI",aux,ch,val);
  console.log("model",model[currentAux.value][ch])
}

function openDialog(id){ document.getElementById(id).style.display="block"; }
function closeDialog(id){ document.getElementById(id).style.display="none"; }

function connectToMixer(){
  var ip=document.getElementById("mixer-ip").value;
  appendLog("Tentativo connessione a "+ip);
  setTimeout(function(){ appendLog("Connesso a "+ip); }, 500);
}

function appendLog(msg){
  var area=document.getElementById("log-area");
  area.value += msg + "\n";
  area.scrollTop = area.scrollHeight;
}

// Footer slider principale
var mainSlider=document.getElementById("slider-range");
var mainSliderValue=document.getElementById("slider-value");
mainSlider.oninput=function(){
  mainSliderValue.textContent= parseFloat(mainSlider.value).toFixed(1);
};

var configBtn = document.getElementById('open-config-dialog');
var footerLabel = document.getElementById('slider-label'); // bottone header
configBtn.textContent = '✏️  AUX: ' + currentAux.value;
footerLabel.textContent = "Master AUX: " + currentAux.value;

// genera la lista radio AUX all'apertura del dialog
// genera la lista radio AUX all'apertura del dialog
function populateAuxList() {
    var auxList = document.getElementById('aux-list');
    var configBtn = document.getElementById('open-config-dialog'); // bottone header
    var footerLabel = document.getElementById('slider-label'); // bottone header
    auxList.innerHTML = ''; // reset

    for (var i = 1; i <= auxCount; i++) {
        var label = document.createElement('label');

        var radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'aux';
        radio.value = i;
        if (i === currentAux.value) radio.checked = true;

        radio.onchange = function() {
            currentAux.value = parseInt(this.value);
            console.log('currentAux.value changed to', currentAux.value);
            configBtn.textContent = '✏️ : AUX ' + currentAux.value;
            footerLabel.textContent = "Master AUX: " + currentAux.value;
        };

        label.appendChild(radio);
        label.appendChild(document.createTextNode(' AUX ' + i));
        auxList.appendChild(label);
    }

    // Imposta subito il testo del pulsante Config all'apertura del dialog
    configBtn.textContent = '✏️  AUX: ' + currentAux.value;
    footerLabel.textContent = "Master AUX: " + currentAux.value;
}

// aprendo il dialog config
function openDialog(id) {
    document.getElementById(id).style.display = 'block';
    if(id === 'config-dialog') populateAuxList();
}

// Funzione dummy chiamata quando cambia l'opzione
function onListenOptionChange(value) {
    console.log("Opzione selezionata:", value);
    // qui puoi mettere la tua funzione reale
}


function populateListenList() {
    const list = document.getElementById('listen-list');
    list.innerHTML = ''; // reset

    for (let i = 0; i <= 10; i++) {
        const id = 'listen-option-' + i;
        const label = document.createElement('label');

        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'listenOption';
        radio.value = i;
        radio.id = id;

        if (i === currentAux.value) radio.checked = true;

        radio.onchange = function() {
            onListenOptionChange(this.value);
        };

        label.appendChild(radio);
        label.appendChild(document.createTextNode(i === 0 ? 'Main PA' : `AUX ${i}`));
        list.appendChild(label);
    }
}

// Aprendo il dialog, popola la select
// Aprendo il dialog, popola la lista
document.getElementById('listenButton').addEventListener('click', function() {
    openDialog('listen-dialog');
    populateListenList();
});

const listenDialog = document.getElementById('listenDialog');
const listenButton = document.getElementById('listenButton');
const closeListenDialog = document.getElementById('closeListenDialog');

// Al posto di: listenDialog.showModal();
document.getElementById('listenButton').addEventListener('click', function() {
  openDialog('listen-dialog');
});

// Al posto di: listenDialog.close();
document.getElementById('listen-dialog-close').addEventListener('click', function() {
  closeDialog('listen-dialog');
});


document.getElementById('fullscreen-btn').onclick = function () {
  const doc = document.documentElement;
  if (!document.fullscreenElement && 
      !document.webkitFullscreenElement && 
      !document.mozFullScreenElement && 
      !document.msFullscreenElement) {
    // Entra in fullscreen
    if (doc.requestFullscreen) doc.requestFullscreen();
    else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
    else if (doc.mozRequestFullScreen) doc.mozRequestFullScreen();
    else if (doc.msRequestFullscreen) doc.msRequestFullscreen();
  } else {
    // Esci dal fullscreen
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
    else if (document.msExitFullscreen) document.msExitFullscreen();
  }
};


</script>


</script>

</body>
</html>
